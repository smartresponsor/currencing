services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Currencing\Service\Http\Currency\:
    resource: '../../src/Service/Http/Currency/'
    tags: ['controller.service_arguments']

  App\Currencing\DataFixtures\:
    resource: '../../src/DataFixtures/'

  App\Currencing\Form\:
    resource: '../../src/Form/'

  App\Currencing\Repository\:
    resource: '../../src/Repository/'

  App\Currencing\Service\:
    resource: '../../src/Service/'
    exclude:
      - '../../src/Service/Http/'

  App\Currencing\Validator\:
    resource: '../../src/Validator/'

  App\Currencing\ServiceInterface\CurrencyMetadataProviderInterface:
    alias: App\Currencing\Service\CurrencyIntlMetadataProvider

  App\Currencing\ServiceInterface\CurrencyCodeValidatorInterface:
    alias: App\Currencing\Service\CurrencyCodeValidator

  App\Currencing\ServiceInterface\CurrencyPrecisionResolverInterface:
    alias: App\Currencing\Service\CurrencyPrecisionResolver

  App\Currencing\ServiceInterface\CurrencyDecimalParserInterface:
    alias: App\Currencing\Service\CurrencyDecimalParser

  App\Currencing\ServiceInterface\CurrencyAmountNormalizerInterface:
    alias: App\Currencing\Service\CurrencyCanonicalAmountNormalizer

  App\Currencing\ServiceInterface\CurrencyNormalizerInterface:
    alias: App\Currencing\Service\CurrencyMinorUnitNormalizer

  App\Currencing\ServiceInterface\CurrencyFormatterInterface:
    alias: App\Currencing\Service\CurrencyIntlFormatter

  App\Currencing\ServiceInterface\CurrencyDisplayFormatterInterface:
    alias: App\Currencing\Service\CurrencyDisplayFormatter

  App\Currencing\ServiceInterface\CurrencyChoiceProviderInterface:
    alias: App\Currencing\Service\CurrencyChoiceProvider

  App\Currencing\ServiceInterface\CurrencyMetadataViewProviderInterface:
    alias: App\Currencing\Service\CurrencyMetadataViewProvider

  App\Currencing\ServiceInterface\CurrencySelectorViewProviderInterface:
    alias: App\Currencing\Service\CurrencySelectorViewProvider

  App\Currencing\ServiceInterface\CurrencyAmountInputResolverInterface:
    alias: App\Currencing\Service\CurrencyAmountInputResolver

  App\Currencing\ServiceInterface\CurrencyRoundingPolicyResolverInterface:
    alias: App\Currencing\Service\CurrencyRoundingPolicyResolver

  App\Currencing\ServiceInterface\CurrencyConversionBoundaryProviderInterface:
    alias: App\Currencing\Service\CurrencyConversionBoundaryProvider

  App\Currencing\ServiceInterface\CurrencyTemplateContextProviderInterface:
    alias: App\Currencing\Service\CurrencyTemplateContextProvider
