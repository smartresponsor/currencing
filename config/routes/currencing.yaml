currencing_admin_preview_currencies:
  path: /currencing/admin-preview/currencies
  controller: 'App\Service\Http\Currency\CurrencyAdminPreviewHttpService'
  methods: [GET]

currencing_conversion_boundary:
  path: /currencing/conversion-boundary
  controller: 'App\Service\Http\Currency\CurrencyConversionBoundaryHttpService'
  methods: [GET]

currencing_demo_index:
  path: /currencing/demo
  controller: 'App\Service\Http\Currency\CurrencyDemoHttpService'
  methods: [GET]

currencing_currency_catalog:
  path: /currencing/currencies
  controller: 'App\Service\Http\Currency\CurrencyMetadataHttpService::catalog'
  methods: [GET]

currencing_currency_metadata:
  path: /currencing/currencies/{code}
  controller: 'App\Service\Http\Currency\CurrencyMetadataHttpService::metadata'
  requirements:
    code: '[A-Za-z]{3}'
  methods: [GET]

currencing_currency_selector:
  path: /currencing/currency-selector
  controller: 'App\Service\Http\Currency\CurrencySelectorHttpService'
  methods: [GET]

currencing_template_context:
  path: /currencing/template-context
  controller: 'App\Service\Http\Currency\CurrencyTemplateContextHttpService'
  methods: [GET]

currencing_money_normalize:
  path: /currencing/money/normalize
  controller: 'App\Service\Http\Currency\CurrencyNormalizeHttpService'
  methods: [POST]
