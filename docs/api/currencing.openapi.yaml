openapi: 3.1.0
info:
  title: Currencing API
  version: "1.0.0"
  description: >
    Read and normalization API for the Currencing shared monetary capability.
    Currencing owns currency metadata, ISO code validation, minor units,
    formatting, monetary normalization, and conversion-boundary validation.
servers:
  - url: /
paths:
  /currencing/currencies:
    get:
      operationId: listCurrencingCurrencies
      summary: List active currency metadata
      tags: [Currencing]
      responses:
        "200":
          description: Active currency metadata list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurrencyMetadataViewDTO'
  /currencing/currencies/{code}:
    get:
      operationId: getCurrencingCurrency
      summary: Read one currency metadata entry by ISO code
      tags: [Currencing]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            examples: [USD, EUR, JPY]
      responses:
        "200":
          description: Currency metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyMetadataViewDTO'
        "404":
          description: Currency metadata not found
  /currencing/currency/selector:
    get:
      operationId: getCurrencingCurrencySelector
      summary: Read template-safe currency selector data
      tags: [Currencing]
      responses:
        "200":
          description: Currency selector view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencySelectorViewDTO'
  /currencing/template/context:
    get:
      operationId: getCurrencingTemplateContext
      x-route-name: currencing_template_context
      summary: Read Bridge-safe template context for Currency UI composition
      tags: [Currencing]
      parameters:
        - name: selectedCode
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bridge-safe currency template context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyTemplateContextEnvelope'
  /currencing/money/normalize:
    post:
      operationId: normalizeCurrencingMoney
      summary: Normalize decimal monetary input to minor units
      tags: [Currencing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyNormalizeRequest'
            examples:
              usd:
                value:
                  amount: "12.34"
                  currencyCode: "USD"
                  consumerName: "Ordering"
                  roundingContext: "ordering"
      responses:
        "200":
          description: Normalized monetary amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyAmountResolutionDTO'
        "400":
          description: Invalid amount, unsupported currency, or invalid policy
  /currencing/conversion/boundary:
    get:
      operationId: getCurrencingConversionBoundary
      summary: Read Currencing versus Exchanging responsibility boundary
      tags: [Currencing]
      responses:
        "200":
          description: Boundary metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyConversionBoundaryDTO'
components:
  schemas:
    CurrencyMetadataViewDTO:
      type: object
      required: [code, name, symbol, minorUnit, active]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
        name:
          type: string
        symbol:
          type: string
          nullable: true
        minorUnit:
          type: integer
          minimum: 0
          maximum: 8
        active:
          type: boolean
    CurrencyChoiceDTO:
      type: object
      required: [code, label, symbol, minorUnit]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
        label:
          type: string
        symbol:
          type: string
          nullable: true
        minorUnit:
          type: integer
          minimum: 0
          maximum: 8
    CurrencySelectorViewDTO:
      type: object
      required: [selectedCode, choices]
      properties:
        selectedCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyChoiceDTO'
    CurrencyTemplateContextEnvelope:
      type: object
      required: [component, resource, item]
      properties:
        component:
          type: string
          const: currencing
        resource:
          type: string
          const: currency_template_context
        item:
          $ref: '#/components/schemas/CurrencyTemplateContextDTO'
    CurrencyTemplateContextDTO:
      type: object
      required: [componentKey, selector, currencies, routeNames, capabilities]
      properties:
        componentKey:
          type: string
          example: currencing.currency
        selectedCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        locale:
          type: string
          nullable: true
        selector:
          $ref: '#/components/schemas/CurrencySelectorViewDTO'
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyMetadataViewDTO'
        routeNames:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            type: string
    MoneyNormalizeRequest:
      type: object
      required: [amount, currencyCode]
      properties:
        amount:
          type: string
          examples: ["12.34", "100", "-5.00"]
        currencyCode:
          type: string
          pattern: '^[A-Za-z]{3}$'
        consumerName:
          type: string
          nullable: true
        roundingContext:
          type: string
          nullable: true
          enum: [canonical, ordering, paying, taxating, subscription, formatting, discounting, cash]
        roundingPolicyName:
          type: string
          nullable: true
    CurrencyAmountDTO:
      type: object
      required: [minorAmount, currencyCode]
      properties:
        minorAmount:
          type: integer
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    CurrencyDisplayDTO:
      type: object
      required: [formatted, decimalAmount, currencyCode]
      properties:
        formatted:
          type: string
        decimalAmount:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    CurrencyAmountResolutionDTO:
      type: object
      required: [moneyAmount, moneyDisplay, currencyCode, minorUnit, decimalAmount]
      properties:
        moneyAmount:
          $ref: '#/components/schemas/CurrencyAmountDTO'
        moneyDisplay:
          $ref: '#/components/schemas/CurrencyDisplayDTO'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        minorUnit:
          type: integer
          minimum: 0
          maximum: 8
        decimalAmount:
          type: string
    CurrencyConversionBoundaryDTO:
      type: object
      required:
        - currencingResponsibilities
        - exchangingResponsibilities
        - forbiddenCurrencingResponsibilities
        - dependencyDirection
      properties:
        currencingResponsibilities:
          type: array
          items: { type: string }
        exchangingResponsibilities:
          type: array
          items: { type: string }
        forbiddenCurrencingResponsibilities:
          type: array
          items: { type: string }
        dependencyDirection:
          type: string
